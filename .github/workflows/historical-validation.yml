name: Historical ORION-X Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/historical-validation.yml
      - modules/historical_validation.py
      - modules/historical_replay.py
      - modules/audit_historical_validation.py
      - modules/qae.py
      - modules/prediction.py
      - tests/test_probability_diagnostics.py
      - data/historical_events/iridium33_cosmos2251/historical_tles.3le
      - config.py
      - requirements.txt

permissions:
  contents: read

jobs:
  historical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy sgp4 pytest
          python -m pip install qiskit==2.5.2 qiskit-aer==0.17.2

      - name: Run collision-probability diagnostic tests
        run: python -m pytest -q tests/test_probability_diagnostics.py

      - name: Run archived Iridium 33–Cosmos 2251 replay
        run: |
          python -m modules.historical_validation \
            --tle data/historical_events/iridium33_cosmos2251/historical_tles.3le \
            --output results/historical/iridium33_cosmos2251_validation.csv \
            --rewind-days 30 \
            --snapshot-step-hours 24 \
            --forecast-step-minutes 30 \
            --forecast-horizon-days 35 \
            --qae-eval-qubits 6 \
            --qae-shots 200

      - name: Audit historical validation outputs
        run: python -m modules.audit_historical_validation --input results/historical/iridium33_cosmos2251_validation.csv --output results/historical/iridium33_cosmos2251_audit.json --provenance-manifest data/historical_events/iridium33_cosmos2251/provenance.json

      - name: Upload historical validation and audit files
        uses: actions/upload-artifact@v4
        with:
          name: orion-x-historical-validation
          path: |
            results/historical/iridium33_cosmos2251_validation.csv
            results/historical/iridium33_cosmos2251_audit.json
            results/historical/iridium33_cosmos2251_audit_rows.csv
          if-no-files-found: error
          retention-days: 30
