name: Historical ORION-X Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/historical-validation.yml
      - modules/historical_validation.py
      - modules/historical_replay.py
      - modules/audit_historical_validation.py
      - modules/audit_historical_event_catalog.py
      - modules/build_tle_availability.py
      - modules/provenance_gate.py
      - modules/qae.py
      - modules/prediction.py
      - tests/test_probability_diagnostics.py
      - tests/test_provenance_gate.py
      - tests/test_historical_event_catalog.py
      - tests/test_build_tle_availability.py
      - modules/prepare_spacetrack_provenance.py
      - tests/test_prepare_spacetrack_provenance.py
      - data/historical_events/events.csv
      - data/historical_events/README.md
      - data/historical_events/cerise_ariane/**
      - data/historical_events/iridium33_cosmos2251/historical_tles.3le
      - data/historical_events/iridium33_cosmos2251/provenance.json
      - data/historical_events/iridium33_cosmos2251/record_level_availability.csv
      - data/historical_events/iridium33_cosmos2251/spacetrack_coverage_report.json
      - config.py
      - requirements.txt

permissions:
  contents: read

jobs:
  historical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy sgp4 pytest
          python -m pip install qiskit==2.5.2 qiskit-aer==0.17.2

      - name: Run probability, provenance, event-catalog, and availability tests
        run: |
          python -m pytest -q \
            tests/test_probability_diagnostics.py \
            tests/test_provenance_gate.py \
            tests/test_historical_event_catalog.py \
            tests/test_build_tle_availability.py \
            tests/test_prepare_spacetrack_provenance.py

      - name: Audit historical event catalog readiness
        run: |
          python -m modules.audit_historical_event_catalog \
            --catalog data/historical_events/events.csv \
            --historical-root data/historical_events \
            --output-csv results/historical/event_catalog_readiness.csv

      - name: Run archived Iridium 33–Cosmos 2251 replay
        run: |
          python -m modules.historical_validation \
            --tle data/historical_events/iridium33_cosmos2251/historical_tles.3le \
            --output results/historical/iridium33_cosmos2251_validation.csv \
            --rewind-days 30 \
            --snapshot-step-hours 24 \
            --forecast-step-minutes 30 \
            --forecast-horizon-days 35 \
            --qae-eval-qubits 6 \
            --qae-shots 200

      - name: Audit historical validation outputs
        run: |
          python -m modules.audit_historical_validation \
            --input results/historical/iridium33_cosmos2251_validation.csv \
            --output results/historical/iridium33_cosmos2251_audit.json \
            --provenance-manifest data/historical_events/iridium33_cosmos2251/provenance.json

      - name: Gate operational claims on record-level TLE availability evidence
        run: |
          python -m modules.provenance_gate \
            --validation-csv results/historical/iridium33_cosmos2251_validation.csv \
            --audit-json results/historical/iridium33_cosmos2251_audit.json \
            --audit-rows-csv results/historical/iridium33_cosmos2251_audit_rows.csv \
            --provenance-manifest data/historical_events/iridium33_cosmos2251/provenance.json \
            --repo-root .

      - name: Upload historical validation and readiness reports
        uses: actions/upload-artifact@v4
        with:
          name: orion-x-historical-validation
          path: |
            results/historical/event_catalog_readiness.csv
            results/historical/iridium33_cosmos2251_validation.csv
            results/historical/iridium33_cosmos2251_audit.json
            results/historical/iridium33_cosmos2251_audit_rows.csv
          if-no-files-found: error
          retention-days: 30
